# /etc/s6-linux-init/init.conf - options for s6-linux-init-maker(1)
#
# this file is sourced by /usr/lib/s6-linux-init/rebuild which regenerates
# /etc/s6-linux-init/current, run that script after editing anything here
#
# a regeneration also happens automatically whenever bpm installs or upgrades
# s6-linux-init or baseinit

# PATH every supervised process and rc.init inherits, execline and s6 binaries
# must be reachable through it or the machine will not boot
S6_INIT_PATH="/usr/bin:/bin"

# initial umask, octal
S6_INIT_UMASK="022"

# how much stage 1 yaps, 1 prints important warnings only
S6_INIT_VERBOSITY="1"

# catchall logger timestamps: 0 none, 1 TAI64N, 2 ISO 8601, 3 both
S6_INIT_TIMESTAMP="1"

# yes = copy everything the catchall logger receives to /dev/console as well
# if you want a quiet console, turn this off and read /run/uncaught-logs/current later
S6_INIT_CONSOLE="yes"

# an extra getty started at the same time as rc.init so the machine is still
# reachable if stage 2 fails, leave empty to disable
# if you enable this, point it at a tty that no getty service uses
S6_INIT_EARLY_GETTY=""

# yes = mount a devtmpfs on /dev, leave at no if the kernel does it (CONFIG_DEVTMPFS_MOUNT)
S6_INIT_SLASHDEV="no"

# milliseconds between the SIGTERM and the SIGKILL at shutdown
S6_INIT_GRACE="3000"

# the runlevel (the s6-rc bundle) booted into when the kernel command line
# doesn't specify anything different
S6_INIT_DEFAULT="default"

# user the catchall logger runs as, root is fine
S6_INIT_LOGUSER="root"

# extra variables put in the global environment, one VAR=VALUE per line
#S6_INIT_ENV="TZ=UTC"

# basix default sysctl settings (mostly for hardening)
#
# this file is owned by baselayout but feel free to edit
# ideally though, just create a higher number config in this
# same directory (like 20-myconfig.conf)

# don't let unprivileged users follow or write through links and fifos they don't own
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2

# hide kernel pointers and the kernel log from unprivileged users
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1

# SYN flood protection
net.ipv4.tcp_syncookies = 1

# basic antispoofing
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.rp_filter = 1

# ignore ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# use temporary privacy addresses for outgoing ipv6
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# prevent TIME-WAIT assasination
net.ipv4.tcp_rfc1337 = 1

# address space layout randomization
kernel.randomize_va_space = 2
vm.mmap_rnd_bits = 32 # max ASLR randomness

# disable kexec
kernel.kexec_load_disabled = 1

# append PID to the core filename
kernel.core_uses_pid = 1

# block non uid0 kernel profiling
kernel.perf_event_paranoid = 2

# block non-ancestor ptrace access
kernel.yama.ptrace_scope = 1

# block unpriv'd ebpf
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2 # make the bpf JIT mask constants

# never let suid programs coredump
fs.suid_dumpable = 0

# prevent users from triggering TTY line-discipline modules
dev.tty.ldisc_autoload = 0

# bump default max map count, this is an arbitrary number
# but some stuff needs it raised (some games like dayz)
vm.max_map_count = 1048576
